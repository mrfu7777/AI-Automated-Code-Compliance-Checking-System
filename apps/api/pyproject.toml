[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "code-compliance-api"
version = "0.3.0"
description = "API and worker foundation for evidence-backed building code compliance review"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "celery==5.6.3",
  "fastapi==0.141.1",
  "minio==7.2.20",
  "onnxruntime==1.29.0",
  "pillow==12.3.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.22",
  "pypdfium2==5.13.0",
  "rapidocr==3.9.2",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["minio.*", "pypdfium2.*", "rapidocr.*"]
ignore_missing_imports = true
