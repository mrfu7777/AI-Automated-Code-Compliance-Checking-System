name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest --cov=app --cov-report=term-missing
      - name: Validate migrations
        run: alembic heads

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create local configuration
        run: |
          cp .env.example .env
          sed --in-place "s/^RELEASE_REVISION=.*/RELEASE_REVISION=${GITHUB_SHA}/" .env
          sed --in-place 's/^RELEASE_IMAGE=.*/RELEASE_IMAGE=source-build/' .env
          echo "RELEASE_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=source-build" >> "$GITHUB_ENV"
      - name: Validate Docker Compose
        run: |
          docker compose -f infra/docker-compose.yml config --quiet
          APP_ENV=production \
          AUTH_MODE=api_key \
          DEMO_MODE_ENABLED=false \
          BOOTSTRAP_API_KEY=ci-bootstrap-key-longer-than-thirty-two-characters \
          API_KEY_PEPPER=ci-api-key-pepper-longer-than-thirty-two-characters \
          docker compose \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.production.yml \
            config --quiet
      - name: Start the application stack
        run: docker compose -f infra/docker-compose.yml up --build --detach
      - name: Wait for the API and web application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/v1/health >/dev/null &&
               curl --fail --silent http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml ps
          exit 1
      - name: Verify the applied database migration
        run: docker compose -f infra/docker-compose.yml exec --no-TTY api alembic current
      - name: Run the guided V1 demonstration
        run: |
          release_manifest=$(curl --fail --show-error --silent http://localhost:8000/api/v1/release)
          echo "$release_manifest" |
            jq --exit-status --arg revision "$GITHUB_SHA" \
              '.app_version == "1.0.0" and
               .source_revision == $revision and
               .image == "source-build" and
               .demo_mode_enabled == true'
          scripts/demo-smoke.sh
      - name: Exercise PostgreSQL backup and isolated restore
        run: |
          docker compose -f infra/docker-compose.yml exec --no-TTY postgres sh -c '
            pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /tmp/ci.dump &&
            createdb -U "$POSTGRES_USER" ci_restore &&
            pg_restore -U "$POSTGRES_USER" -d ci_restore /tmp/ci.dump &&
            dropdb -U "$POSTGRES_USER" ci_restore &&
            rm /tmp/ci.dump'
      - name: Print service logs after a failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - name: Stop the application stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
